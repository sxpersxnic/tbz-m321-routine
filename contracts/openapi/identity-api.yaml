openapi: 3.1.0
info:
  title: Identity Service API
  version: 1.0.0
  description: |
    Standalone identity provider. Issues RS256-signed access tokens
    (iss = routine-identity, aud = routine-api, sub = user ID). All other
    services verify tokens themselves against the public JWKS – without a shared
    secret and without calling the identity service on every request.
servers:
  - url: http://localhost:8080
    description: via the API gateway (JWKS is reachable internally only)

paths:
  /api/v1/auth/register:
    post:
      summary: Register a user
      operationId: register
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '201': { description: registered, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/login:
    post:
      summary: Sign in and receive an access token
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { const: Bearer }
                  expiresIn: { type: integer, description: seconds }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/me:
    get:
      summary: Current user
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Problem' }

  /.well-known/jwks.json:
    get:
      summary: Public signing keys (JWKS) – service-internal only
      operationId: jwks
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: object } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
