openapi: 3.1.0
info:
  title: Task Service API
  version: 1.0.0
  description: |
    Aufgaben des Benutzers. Aufgaben entstehen manuell oder durch die Action
    `task.create` einer Routine (asynchron, siehe asyncapi/routine-messaging.yaml).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /api/v1/tasks:
    get:
      summary: Eigene Aufgaben
      operationId: listTasks
      parameters:
        - { name: status, in: query, schema: { enum: [OPEN, DONE] } }
      responses:
        '200':
          description: Aufgaben (neueste zuerst)
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Task' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      summary: Aufgabe manuell erstellen
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                priority: { enum: [low, normal, high] }
                dueDate: { type: string, format: date }
      responses:
        '201': { description: erstellt, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/Problem' }

  /api/v1/tasks/{taskId}:
    patch:
      summary: Aufgabe erledigen / wieder öffnen
      operationId: updateTaskStatus
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties: { status: { enum: [OPEN, DONE] } }
      responses:
        '200': { description: aktualisiert, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Fehler (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } }
  schemas:
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { enum: [low, normal, high] }
        status: { enum: [OPEN, DONE] }
        dueDate: { type: [string, 'null'], format: date }
        sourceExecutionId: { type: [string, 'null'], format: uuid, description: gesetzt, wenn eine Routine die Aufgabe erstellt hat }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
