openapi: 3.1.0
info:
  title: Trigger Service API
  version: 1.0.0
  description: |
    Event triggers (docs/v2/services/trigger-service.md). trigger-service matches every domain and
    execution event against the event-triggered routines and asks routine-service to start them
    (StartRoutineRequested, see asyncapi/routine-messaging.yaml). Its API explains those decisions.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /api/v1/triggers/log:
    get:
      summary: Why did (or didn't) this routine run? The last 50 decisions for one of the user's routines
      operationId: listTriggerDecisions
      parameters:
        - { name: routineId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: decisions, newest first (kept 7 days); empty for another user's routine
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TriggerDecision' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/triggers/resync:
    post:
      summary: Rebuild the subscriptions from routine-service (admin)
      operationId: resyncTriggers
      responses:
        '200':
          description: rebuilt
          content:
            application/json:
              schema: { type: object, properties: { stored: { type: integer }, removed: { type: integer } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8080/auth/realms/routine/.well-known/openid-configuration
      description: >-
        Access token (JWT) from Keycloak, realm `routine` (OpenID Connect), sent as `Authorization: Bearer <token>`.
        Every service checks the signature against the realm's keys, `iss` = the realm URL and `aud` ∋ `routine-api`.
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } }
  schemas:
    TriggerDecision:
      type: object
      required: [eventMessageId, event, outcome, at]
      properties:
        eventMessageId: { type: string, format: uuid, description: 'the event; a started run carries the idempotency key event:<eventMessageId>' }
        event: { type: string, description: 'trigger type, e.g. task.completed' }
        outcome:
          enum: [started, filtered, loop, inactive]
          description: 'started = asked routine-service to start a run; filtered = the filter did not let the event through; loop = the routine caused the event itself, or the chain was 5 deep; inactive = the routine is switched off'
        at: { type: string, format: date-time }
