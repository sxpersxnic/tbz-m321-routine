openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    Posteingang des Benutzers. Benachrichtigungen entstehen asynchron aus der
    Action `notification.send` sowie aus den Events ExecutionCompleted /
    ExecutionFailed (siehe asyncapi/routine-messaging.yaml).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /api/v1/notifications:
    get:
      summary: Eigene Benachrichtigungen
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: nur ungelesene }
      responses:
        '200':
          description: Benachrichtigungen (neueste zuerst)
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } } } }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/notifications/{notificationId}/read:
    post:
      summary: Als gelesen markieren (idempotent)
      operationId: markNotificationRead
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: markiert, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Fehler (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } }
  schemas:
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        priority: { enum: [low, normal, high] }
        category: { enum: [action, execution], description: 'action = notification.send, execution = Execution-Event' }
        executionId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
