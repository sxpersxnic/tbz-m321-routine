openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    The user's inbox. Notifications are created asynchronously from the
    `notification.send` action and from the ExecutionCompleted /
    ExecutionFailed events (see asyncapi/routine-messaging.yaml).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /api/v1/notifications:
    get:
      summary: Own notifications
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: unread only }
        - { name: category, in: query, schema: { enum: [action, execution] }, description: 'action = sent by a routine step, execution = run outcome' }
      responses:
        '200':
          description: notifications (newest first)
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } } } }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/notifications/{notificationId}/read:
    post:
      summary: Mark as read (idempotent)
      operationId: markNotificationRead
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: marked, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/notifications/{notificationId}:
    delete:
      summary: Delete a notification
      operationId: deleteNotification
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: deleted }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } }
  schemas:
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        priority: { enum: [low, normal, high] }
        category: { enum: [action, execution], description: 'action = notification.send, execution = execution event' }
        executionId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
