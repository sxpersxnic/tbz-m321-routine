openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    The user's inbox. Notifications are created asynchronously from the
    `notification.send` action and from the ExecutionCompleted /
    ExecutionFailed events (see asyncapi/routine-messaging.yaml).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /api/v1/notifications:
    get:
      summary: Own notifications
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: unread only }
        - { name: category, in: query, schema: { enum: [action, execution] }, description: 'action = sent by a routine step, execution = run outcome' }
        - { name: kind, in: query, schema: { enum: [info, question] } }
        - { name: state, in: query, schema: { enum: [open, answered, expired] } }
      responses:
        '200':
          description: notifications (newest first)
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } } } }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/notifications/{notificationId}/read:
    post:
      summary: Mark as read (idempotent)
      operationId: markNotificationRead
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: marked, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/notifications/{notificationId}/answer:
    post:
      summary: Answer a question ("Ask me") – completes the routine step waiting for it
      operationId: answerQuestion
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], additionalProperties: false, properties: { value: { type: string, description: 'one of the question''s options[].value' } } }
      responses:
        '200': { description: answered (and read), content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: not an open question (answered, expired, or no question), $ref: '#/components/responses/Problem' }
        '422': { description: not one of the answers, $ref: '#/components/responses/Problem' }

  /api/v1/notifications/{notificationId}:
    delete:
      summary: Delete a notification
      operationId: deleteNotification
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: deleted }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: an open question – answer it, or skip its step on the run, $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8080/auth/realms/routine/.well-known/openid-configuration
      description: >-
        Access token (JWT) from Keycloak, realm `routine` (OpenID Connect), sent as `Authorization: Bearer <token>`.
        Every service checks the signature against the realm's keys, `iss` = the realm URL and `aud` ∋ `routine-api`.
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } }
  schemas:
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        priority: { enum: [low, normal, high] }
        category: { enum: [action, execution], description: 'action = notification.send, execution = execution event' }
        executionId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time, description: 'set on a failure notification once its run was resumed (ExecutionResumed)' }
        kind: { enum: [info, question] }
        state: { enum: [open, answered, expired], description: 'questions: open until answered, expired when their step expired or was skipped' }
        options: { type: [array, 'null'], items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
        answer: { type: [object, 'null'], properties: { value: { type: string }, label: { type: string }, answeredAt: { type: string, format: date-time } } }
        routineId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time }
