asyncapi: 3.0.0
info:
  title: Routine Messaging
  version: 1.2.0
  description: |
    Asynchronous contracts between the Routine services (RabbitMQ, AMQP 0-9-1).

    **Envelope** – every message is a JSON envelope (schemas/envelope.schema.json)
    with `messageId`, `type`, `version`, `occurredAt`, `source`, `correlationId`,
    an optional `causationId` and the type-specific `data`. In addition, all
    messages carry the AMQP headers `x-correlation-id` and `traceparent` (W3C Trace Context).

    **Delivery** – at-least-once. Consumers must be idempotent; the
    idempotency keys are `actionId` (actions) and `executionId` (events).

    **Compatibility rules** – consumers ignore unknown fields
    (tolerant reader). Producers may only add fields; removing or renaming
    requires expand-and-contract with a new `version` (see ExecutionCompleted).

    **Retry/DLQ** – consumers schedule transient failures into their own retry queues
    (`<queue>.retry.<delay>ms`, TTL + dead-lettering back) and move
    unprocessable messages to `<queue>.dlq`.

defaultContentType: application/json

servers:
  rabbitmq:
    host: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: the topology is loaded from infra/rabbitmq/definitions.json

channels:
  actionRequests:
    address: routine.actions
    title: Action commands
    description: |
      Topic exchange. Routing key `action.<actionType>`, e.g. `action.task.create`.
      The routine service does not know which service executes an action – the
      bindings decide (action.task.# → task-service, action.http.#/weather.#/summary.#/email.# →
      integration-worker, action.notification.# → notification-service).
      Undeliverable commands end up in `routine.unrouted-actions` via the alternate exchange.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: routine.actions, type: topic, durable: true, autoDelete: false }
    messages:
      ActionRequested: { $ref: '#/components/messages/ActionRequested' }
      ActionCancelRequested: { $ref: '#/components/messages/ActionCancelRequested' }

  actionResults:
    address: routine.action-results
    title: Action results
    description: 'Topic exchange. Routing keys: action.completed, action.failed, action.retry-scheduled, action.awaiting-user'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: routine.action-results, type: topic, durable: true, autoDelete: false }
    messages:
      ActionCompleted: { $ref: '#/components/messages/ActionCompleted' }
      ActionFailed: { $ref: '#/components/messages/ActionFailed' }
      ActionAwaitingUser: { $ref: '#/components/messages/ActionAwaitingUser' }
      ActionRetryScheduled: { $ref: '#/components/messages/ActionRetryScheduled' }

  routineEvents:
    address: routine.events
    title: Domain events of the routine service
    description: 'Topic exchange. Routing keys: routine.triggered, execution.completed, execution.failed, execution.resumed, execution.waitingForYou, routine.unhealthy'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: routine.events, type: topic, durable: true, autoDelete: false }
    messages:
      RoutineTriggered: { $ref: '#/components/messages/RoutineTriggered' }
      ExecutionCompletedV1: { $ref: '#/components/messages/ExecutionCompletedV1' }
      ExecutionCompletedV2: { $ref: '#/components/messages/ExecutionCompletedV2' }
      ExecutionFailed: { $ref: '#/components/messages/ExecutionFailed' }
      ExecutionResumed: { $ref: '#/components/messages/ExecutionResumed' }
      ExecutionWaitingForYou: { $ref: '#/components/messages/ExecutionWaitingForYou' }
      RoutineUnhealthy: { $ref: '#/components/messages/RoutineUnhealthy' }

  platformRegistry:
    address: platform.registry
    title: Domain registry
    description: 'Topic exchange. Routing keys: domain.registered, domain.heartbeat. Domains announce their manifests (docs/v2/04-domain-platform.md §4).'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: platform.registry, type: topic, durable: true, autoDelete: false }
    messages:
      DomainRegistered: { $ref: '#/components/messages/DomainRegistered' }
      DomainHeartbeat: { $ref: '#/components/messages/DomainHeartbeat' }

operations:
  # ---- registry
  registerDomains:
    action: receive
    channel: { $ref: '#/channels/platformRegistry' }
    summary: routine-service – queue routine-service.registry (domain.*); applies the acceptance rules of 04 §4.3
    messages:
      - { $ref: '#/channels/platformRegistry/messages/DomainRegistered' }
      - { $ref: '#/channels/platformRegistry/messages/DomainHeartbeat' }

  # ---- routine-service
  publishRoutineTriggered:
    action: send
    channel: { $ref: '#/channels/routineEvents' }
    summary: routine-service (API/scheduler) – execution created (via transactional outbox)
    messages: [{ $ref: '#/channels/routineEvents/messages/RoutineTriggered' }]
  consumeRoutineTriggered:
    action: receive
    channel: { $ref: '#/channels/routineEvents' }
    summary: routine-service – queue routine-service.triggers starts the execution
    messages: [{ $ref: '#/channels/routineEvents/messages/RoutineTriggered' }]
  requestAction:
    action: send
    channel: { $ref: '#/channels/actionRequests' }
    summary: routine-service – publishes the actions of a step, and cancels waiting human steps (expired, run cancelled) (via outbox)
    messages:
      - { $ref: '#/channels/actionRequests/messages/ActionRequested' }
      - { $ref: '#/channels/actionRequests/messages/ActionCancelRequested' }
  consumeActionResults:
    action: receive
    channel: { $ref: '#/channels/actionResults' }
    summary: routine-service – queue routine-service.action-results updates the execution
    messages:
      - { $ref: '#/channels/actionResults/messages/ActionCompleted' }
      - { $ref: '#/channels/actionResults/messages/ActionFailed' }
      - { $ref: '#/channels/actionResults/messages/ActionRetryScheduled' }
      - { $ref: '#/channels/actionResults/messages/ActionAwaitingUser' }
  publishExecutionEvents:
    action: send
    channel: { $ref: '#/channels/routineEvents' }
    summary: routine-service – execution completed/failed (format set by EXECUTION_COMPLETED_FORMAT)
    messages:
      - { $ref: '#/channels/routineEvents/messages/ExecutionCompletedV1' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionCompletedV2' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionFailed' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionResumed' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionWaitingForYou' }
      - { $ref: '#/channels/routineEvents/messages/RoutineUnhealthy' }

  # ---- workers
  executeActions:
    action: receive
    channel: { $ref: '#/channels/actionRequests' }
    summary: task-service, integration-worker (scalable), notification-service – one queue each; domains with human steps also close their items on ActionCancelRequested
    messages:
      - { $ref: '#/channels/actionRequests/messages/ActionRequested' }
      - { $ref: '#/channels/actionRequests/messages/ActionCancelRequested' }
  reportActionResults:
    action: send
    channel: { $ref: '#/channels/actionResults' }
    summary: workers report a result, a retry, a permanent failure, or that a human step waits for a person
    messages:
      - { $ref: '#/channels/actionResults/messages/ActionCompleted' }
      - { $ref: '#/channels/actionResults/messages/ActionFailed' }
      - { $ref: '#/channels/actionResults/messages/ActionRetryScheduled' }
      - { $ref: '#/channels/actionResults/messages/ActionAwaitingUser' }

  # ---- notification-service
  notifyOnExecutionEvents:
    action: receive
    channel: { $ref: '#/channels/routineEvents' }
    summary: notification-service – queue notification-service.execution-events (execution.#, routine.unhealthy); other events are acknowledged and ignored
    messages:
      - { $ref: '#/channels/routineEvents/messages/RoutineUnhealthy' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionCompletedV1' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionCompletedV2' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionFailed' }
      - { $ref: '#/channels/routineEvents/messages/ExecutionResumed' }

components:
  messages:
    RoutineTriggered:
      name: RoutineTriggered
      title: RoutineTriggered v1
      payload: { $ref: '../schemas/routine-triggered.v1.schema.json' }
    ActionRequested:
      name: ActionRequested
      title: ActionRequested v1
      summary: 'v1.1 (additive): actionType `<prefix>.<name>` (camelCase name), optional `context` { mode, timezone, currency, routineName, stepIndex, stepCount, depth, areaId }'
      payload: { $ref: '../schemas/action-requested.v1.schema.json' }
    ActionCompleted:
      name: ActionCompleted
      title: ActionCompleted v1
      payload: { $ref: '../schemas/action-completed.v1.schema.json' }
    ActionFailed:
      name: ActionFailed
      title: ActionFailed v1
      summary: 'v1.1 (additive): error.code is one of the codes of docs/v2/05-messaging.md §6; v1 class names stay accepted'
      payload: { $ref: '../schemas/action-failed.v1.schema.json' }
    ActionAwaitingUser:
      name: ActionAwaitingUser
      title: ActionAwaitingUser v1
      summary: 'A human step waits for a person: { actionId, executionId, actionType, awaiting: { kind, refId, title, dueAt? }, processedBy }'
      payload: { $ref: '../schemas/action-awaiting-user.v1.schema.json' }
    ActionCancelRequested:
      name: ActionCancelRequested
      title: ActionCancelRequested v1
      summary: 'A waiting human step expired or its run was cancelled: { actionId, executionId, actionType, ownerId, reason: expired | skipped | runCancelled } – the domain closes the item and sends no result'
      payload: { $ref: '../schemas/action-cancel-requested.v1.schema.json' }
    ActionRetryScheduled:
      name: ActionRetryScheduled
      title: ActionRetryScheduled v1
      payload: { $ref: '../schemas/action-retry-scheduled.v1.schema.json' }
    ExecutionCompletedV1:
      name: ExecutionCompleted
      title: ExecutionCompleted v1 (deprecated)
      summary: 'Original format: { executionId, message }'
      payload: { $ref: '../schemas/execution-completed.v1.schema.json' }
    ExecutionCompletedV2:
      name: ExecutionCompleted
      title: ExecutionCompleted v2
      summary: 'Structured: { executionId, notification: { title, body }, priority } – during the expand phase also with message'
      payload: { $ref: '../schemas/execution-completed.v2.schema.json' }
    ExecutionFailed:
      name: ExecutionFailed
      title: ExecutionFailed v1
      summary: 'v1.1 (additive): optional errorCode and failedActionType of the failed action, resumeCount'
      payload: { $ref: '../schemas/execution-failed.v1.schema.json' }
    ExecutionResumed:
      name: ExecutionResumed
      title: ExecutionResumed v1
      summary: 'A failed execution goes on from its failed step: { executionId, routineId, ownerId, fromActionKey, resumedBy, resumeCount }'
      payload: { $ref: '../schemas/execution-resumed.v1.schema.json' }
    ExecutionWaitingForYou:
      name: ExecutionWaitingForYou
      title: ExecutionWaitingForYou v1
      summary: 'Only human steps are in flight: { executionId, routineId, ownerId, routineName, awaiting: [{ actionKey, kind, refId, title, dueAt }] } – delivery-service sends push (M8)'
      payload: { $ref: '../schemas/execution-waiting-for-you.v1.schema.json' }
    DomainRegistered:
      name: DomainRegistered
      title: DomainRegistered v1
      summary: '{ manifest, digest, instance } – sent by the domain kit on start and reconnect'
      payload: { $ref: '../schemas/domain-registered.v1.schema.json' }
    DomainHeartbeat:
      name: DomainHeartbeat
      title: DomainHeartbeat v1
      summary: '{ domain, manifestVersion, digest, instance } – every 30 s'
      payload: { $ref: '../schemas/domain-heartbeat.v1.schema.json' }
    RoutineUnhealthy:
      name: RoutineUnhealthy
      title: RoutineUnhealthy v1
      summary: 'Failures in a row reached the routine''s alert threshold (once per streak): { routineId, ownerId, routineName, consecutiveFailures, lastErrorCode, executionId }'
      payload: { $ref: '../schemas/routine-unhealthy.v1.schema.json' }
