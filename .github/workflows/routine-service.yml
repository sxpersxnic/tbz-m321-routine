name: routine-service

on:
  push:
    branches: [main]
    paths:
      - services/routine-service/**
      - libs/**
      - contracts/**
      - docker/node-service.Dockerfile
      - package-lock.json
      - biome.json
      - tsconfig.json
      - .github/workflows/routine-service.yml
      - .github/workflows/_node-service.yml
  pull_request:
    paths:
      - services/routine-service/**
      - libs/**
      - contracts/**
      - docker/node-service.Dockerfile
      - package-lock.json
      - biome.json
      - tsconfig.json
      - .github/workflows/routine-service.yml
      - .github/workflows/_node-service.yml
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/_node-service.yml
    with:
      service: routine-service
      database: true # engine tests run against a real Postgres
