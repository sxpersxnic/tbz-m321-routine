name: notification-service

on:
  push:
    branches: [main]
    paths:
      - services/notification-service/**
      - libs/**
      - contracts/**
      - docker/node-service.Dockerfile
      - package-lock.json
      - biome.json
      - tsconfig.json
      - .github/workflows/notification-service.yml
      - .github/workflows/_node-service.yml
  pull_request:
    paths:
      - services/notification-service/**
      - libs/**
      - contracts/**
      - docker/node-service.Dockerfile
      - package-lock.json
      - biome.json
      - tsconfig.json
      - .github/workflows/notification-service.yml
      - .github/workflows/_node-service.yml
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/_node-service.yml
    with:
      service: notification-service
