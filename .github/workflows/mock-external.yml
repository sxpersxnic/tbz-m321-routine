name: mock-external

on:
  push:
    branches: [main]
    paths:
      - services/mock-external/**
      - libs/**
      - contracts/**
      - docker/node-service.Dockerfile
      - package-lock.json
      - biome.json
      - tsconfig.json
      - .github/workflows/mock-external.yml
      - .github/workflows/_node-service.yml
  pull_request:
    paths:
      - services/mock-external/**
      - libs/**
      - contracts/**
      - docker/node-service.Dockerfile
      - package-lock.json
      - biome.json
      - tsconfig.json
      - .github/workflows/mock-external.yml
      - .github/workflows/_node-service.yml
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/_node-service.yml
    with:
      service: mock-external
