# Deployment configuration: compose (one host) and the Kubernetes manifests (three VMs) must stay valid,
# the scripts must pass shellcheck.
name: deployment

on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - deploy/**
      - infra/**
      - scripts/**
      - .github/workflows/deployment.yml
  pull_request:
    paths:
      - compose.yaml
      - deploy/**
      - infra/**
      - scripts/**
      - .github/workflows/deployment.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: compose.yaml
        run: docker compose config --quiet
      - name: deploy/k8s – render as deploy.sh does, validate against the Kubernetes schemas
        run: |
          deploy/deploy.sh render # secrets are generated – throwaway values on the runner
          kubectl kustomize deploy/.generated >rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary - <rendered.yaml
      - name: RabbitMQ definitions and Keycloak realm are valid JSON
        run: jq empty infra/rabbitmq/definitions.json infra/keycloak/realm-routine.json
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh deploy/*.sh
