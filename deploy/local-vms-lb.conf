# Load balancer in front of the simulated VMs (deploy/local-vms.sh) – stands in for a cloud load
# balancer / keepalived VIP in front of real VMs: any VM that is down is skipped.
upstream vms {
  server vm1:8080 max_fails=1 fail_timeout=5s;
  server vm2:8080 max_fails=1 fail_timeout=5s;
  server vm3:8080 max_fails=1 fail_timeout=5s;
}
upstream jaeger {
  server vm1:16686 max_fails=1 fail_timeout=5s;
  server vm2:16686 max_fails=1 fail_timeout=5s;
  server vm3:16686 max_fails=1 fail_timeout=5s;
}
server {
  listen 8080;
  location / {
    proxy_pass http://vms;
    proxy_set_header Host $host;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 2s;
  }
}
server {
  listen 16686;
  location / { proxy_pass http://jaeger; proxy_connect_timeout 2s; }
}
