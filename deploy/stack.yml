# Routine on three VMs – Docker Swarm stack. Deployed by deploy/deploy.sh (see docs/deployment.md);
# the single-host variant for development is compose.yaml.
#
# Placement (node labels are set by deploy.sh):
#   every VM   edge (global), one rabbitmq node, at most one replica of every platform service
#   vm1        routine.data=true → the five PostgreSQL databases (their volumes live on that VM)
#   rabbitmq-N routine.rabbitmq=N → one broker node per VM
#
# Variables (exported by deploy.sh): TAG, CONFIG_VERSION, PUBLIC_URL, SERVICE_REPLICAS, INTEGRATION_WORKER_REPLICAS and the
# secrets from deploy/<inventory>.secrets.env – generated once per deployment, never committed. A missing
# secret stops the deploy (${VAR:?}) instead of falling back to a well-known default.
version: "3.9"

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AMQP_URL: amqp://routine:${RABBITMQ_PASSWORD:?}@rabbitmq-1:5672,amqp://routine:${RABBITMQ_PASSWORD:?}@rabbitmq-2:5672,amqp://routine:${RABBITMQ_PASSWORD:?}@rabbitmq-3:5672
  JWKS_URL: http://keycloak:8080/auth/realms/routine/protocol/openid-connect/certs
  JWT_ISSUER: ${PUBLIC_URL:?}/auth/realms/routine
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

x-healthcheck: &node-healthcheck
  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 20s

# Stateless platform services: two replicas, never both on the same VM, zero-downtime rolling updates.
x-replicated: &replicated
  replicas: ${SERVICE_REPLICAS:-2}
  placement:
    max_replicas_per_node: 1
  update_config: { parallelism: 1, order: start-first, failure_action: rollback, monitor: 20s }
  rollback_config: { parallelism: 1, order: start-first }
  restart_policy: { condition: any, delay: 2s }

x-rabbitmq: &rabbitmq
  image: rabbitmq:4.1-management-alpine
  environment:
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?} # shared secret of the cluster nodes
  configs:
    - { source: rabbitmq_conf, target: /etc/rabbitmq/conf.d/20-routine.conf }
    - { source: rabbitmq_definitions, target: /etc/rabbitmq/definitions.json }
    - { source: rabbitmq_advanced, target: /etc/rabbitmq/advanced.config }
  # Swarm puts a task into service DNS only once it is healthy – and a node finishes booting only after it
  # found its peers by DNS. `ping` passes as soon as the Erlang node runs (before peer discovery), so the
  # nodes can see each other; it still detects a dead node. (compose.yaml keeps the stricter check for depends_on.)
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 5s
    timeout: 10s
    retries: 6
    start_period: 10s

x-postgres: &postgres
  image: postgres:17-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 30
  deploy:
    placement:
      constraints: [node.labels.routine.data == true]
    restart_policy: { condition: any, delay: 2s }

x-broker-node-deploy: &broker-node-deploy
  endpoint_mode: dnsrr # the name resolves to the container itself – Erlang clustering needs the real node
  restart_policy: { condition: any, delay: 2s }
  update_config: { order: stop-first }

services:
  # ------------------------------------------------------------ edge: one per VM, :8080 on every VM
  # Host mode: a VM's :8080 is served by its own edge, never forwarded to a VM that just died – the load
  # balancer / DNS in front of the VMs skips a dead VM at once (the routing mesh would still send it traffic
  # until the swarm notices the VM is gone).
  edge:
    image: nginx:1.29-alpine
    ports:
      - { target: 80, published: "${GATEWAY_PORT:-8080}", mode: host }
    configs:
      - { source: edge_conf, target: /etc/nginx/conf.d/default.conf }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/edge/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      mode: global
      restart_policy: { condition: any, delay: 2s }
      update_config: { parallelism: 1, order: stop-first } # the host port is free only once the old edge stopped

  # ------------------------------------------------------------ broker: one node per VM
  rabbitmq-1:
    <<: *rabbitmq
    hostname: rabbitmq-1
    ports: [{ target: 15672, published: 15672, mode: host }]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    deploy:
      <<: *broker-node-deploy
      placement: { constraints: [node.labels.routine.rabbitmq == 1] }
  rabbitmq-2:
    <<: *rabbitmq
    hostname: rabbitmq-2
    ports: [{ target: 15672, published: 15672, mode: host }]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    deploy:
      <<: *broker-node-deploy
      placement: { constraints: [node.labels.routine.rabbitmq == 2] }
  rabbitmq-3:
    <<: *rabbitmq
    hostname: rabbitmq-3
    ports: [{ target: 15672, published: 15672, mode: host }]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    deploy:
      <<: *broker-node-deploy
      placement: { constraints: [node.labels.routine.rabbitmq == 3] }

  # Jaeger and the RabbitMQ management UI are admin tools: allow their ports only from the admin network
  # (docs/deployment.md §3). Jaeger has no login of its own.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686"
    deploy:
      restart_policy: { condition: any, delay: 2s }

  # ------------------------------------------------------------ databases (vm1)
  keycloak-db:
    <<: *postgres
    environment: { POSTGRES_USER: keycloak, POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?}", POSTGRES_DB: keycloak }
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
  routine-db:
    <<: *postgres
    environment: { POSTGRES_USER: routine, POSTGRES_PASSWORD: "${ROUTINE_DB_PASSWORD:?}", POSTGRES_DB: routine }
    volumes: [routine-db-data:/var/lib/postgresql/data]
  task-db:
    <<: *postgres
    environment: { POSTGRES_USER: task, POSTGRES_PASSWORD: "${TASK_DB_PASSWORD:?}", POSTGRES_DB: task }
    volumes: [task-db-data:/var/lib/postgresql/data]
  notification-db:
    <<: *postgres
    environment: { POSTGRES_USER: notification, POSTGRES_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?}", POSTGRES_DB: notification }
    volumes: [notification-db-data:/var/lib/postgresql/data]
  integration-db:
    <<: *postgres
    environment: { POSTGRES_USER: integration, POSTGRES_PASSWORD: "${INTEGRATION_DB_PASSWORD:?}", POSTGRES_DB: integration }
    volumes: [integration-db-data:/var/lib/postgresql/data]

  # ------------------------------------------------------------ platform services
  web:
    image: routine/web:${TAG:-latest}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: *replicated

  gateway:
    image: routine/gateway:${TAG:-latest}
    init: true
    healthcheck: *node-healthcheck
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: gateway
      ROUTINE_URL: http://routine-service:3000
      TASK_URL: http://task-service:3000
      NOTIFICATION_URL: http://notification-service:3000
      INTEGRATION_WORKER_URL: http://integration-worker:3000
      WEB_URL: http://web:80
      EXTERNAL_API_URL: http://mock-external:8090
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq-1:15672,http://rabbitmq-2:15672,http://rabbitmq-3:15672
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
    deploy:
      <<: *replicated
      endpoint_mode: dnsrr # the edge gets every gateway task and fails over per request (like in compose)

  # identity provider – two replicas on different VMs form one cluster (discovery through keycloak-db)
  keycloak:
    image: routine/keycloak:${TAG:-latest}
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: ${PUBLIC_URL:?}/auth # the URL users open – all tokens carry it as issuer
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # a task has the overlay (eth0) and a VM-local bridge – cluster traffic must use the overlay
      KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS: match-interface:eth0
      ROUTINE_PUBLIC_URL: ${PUBLIC_URL:?}
      # service accounts (confidential clients in the realm) – the same secret goes to the service itself
      INTEGRATION_WORKER_TOKEN_SECRET: ${INTEGRATION_WORKER_TOKEN_SECRET:?}
    healthcheck:
      # status line, not body: a not-ready body still holds "UP" (the "Graceful Shutdown" sub-check)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '^HTTP/1.1 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
    deploy: *replicated

  routine-service:
    image: routine/routine-service:${TAG:-latest}
    init: true
    healthcheck: *node-healthcheck
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: routine-service
      DATABASE_URL: postgres://routine:${ROUTINE_DB_PASSWORD:?}@routine-db:5432/routine
      EXECUTION_COMPLETED_FORMAT: ${EXECUTION_COMPLETED_FORMAT:-v2}
      WAITING_AFTER_MS: ${WAITING_AFTER_MS:-10000}
      CHAOS_DUPLICATE_PUBLISH_RATE: ${CHAOS_DUPLICATE_PUBLISH_RATE:-0}
    deploy: *replicated

  task-service:
    image: routine/task-service:${TAG:-latest}
    init: true
    healthcheck: *node-healthcheck
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: task-service
      DATABASE_URL: postgres://task:${TASK_DB_PASSWORD:?}@task-db:5432/task
      CHAOS_FAILURE_RATE: ${TASK_CHAOS_FAILURE_RATE:-0}
    deploy: *replicated

  notification-service:
    image: routine/notification-service:${TAG:-latest}
    init: true
    healthcheck: *node-healthcheck
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: notification-service
      DATABASE_URL: postgres://notification:${NOTIFICATION_DB_PASSWORD:?}@notification-db:5432/notification
      COMPLETION_EVENT_READER: ${COMPLETION_EVENT_READER:-tolerant}
      CHAOS_FAILURE_RATE: ${NOTIFICATION_CHAOS_FAILURE_RATE:-0}
    deploy: *replicated

  integration-worker:
    image: routine/integration-worker:${TAG:-latest}
    init: true
    healthcheck: *node-healthcheck
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: integration-worker
      DATABASE_URL: postgres://integration:${INTEGRATION_DB_PASSWORD:?}@integration-db:5432/integration
      SERVICE_TOKEN_SECRET: ${INTEGRATION_WORKER_TOKEN_SECRET:?} # its service account (client-credentials)
      EXTERNAL_API_URL: http://mock-external:8090
      HTTP_ALLOWED_HOSTS: mock-external
      PREFETCH: ${INTEGRATION_WORKER_PREFETCH:-1}
      CHAOS_FAILURE_RATE: ${INTEGRATION_CHAOS_FAILURE_RATE:-0}
    deploy:
      replicas: ${INTEGRATION_WORKER_REPLICAS:-3} # stateless → docker service scale routine_integration-worker=6
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      restart_policy: { condition: any, delay: 2s }

  # simulated third-party APIs (not part of the platform) – reached only inside the overlay network
  mock-external:
    image: routine/mock-external:${TAG:-latest}
    init: true
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: mock-external
      PORT: 8090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      restart_policy: { condition: any, delay: 2s }

configs:
  rabbitmq_conf:
    name: routine_rabbitmq_conf_${CONFIG_VERSION:-0}
    file: ../infra/rabbitmq/rabbitmq.conf
  rabbitmq_definitions:
    name: routine_rabbitmq_definitions_${CONFIG_VERSION:-0}
    file: .generated/rabbitmq-definitions.json # infra/rabbitmq/definitions.json with the generated password
  rabbitmq_advanced:
    name: routine_rabbitmq_advanced_${CONFIG_VERSION:-0}
    file: ../infra/rabbitmq/advanced.config
  edge_conf:
    name: routine_edge_conf_${CONFIG_VERSION:-0}
    file: ../infra/edge/nginx.conf

# local to the VM a task is pinned to (databases → vm1, rabbitmq-N → its VM)
volumes:
  rabbitmq-data:
  keycloak-db-data:
  routine-db-data:
  task-db-data:
  notification-db-data:
  integration-db-data:
