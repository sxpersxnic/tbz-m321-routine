# Tracing – not in the critical path: one replica, anywhere; rescheduled when its VM fails (in-memory traces
# are lost then).
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-http, port: 4318 }
    - { name: ui, port: 16686 }
---
# UI on :16686 of every VM – admins only: Jaeger has no login (docs/deployment.md §3)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, nodePort: 16686 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.10.0
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          readinessProbe:
            tcpSocket: { port: 16686 }
            periodSeconds: 5
