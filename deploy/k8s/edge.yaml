# Edge: one nginx per VM on :8080 (hostPort) – a VM's :8080 is served by its own edge, never forwarded to a
# VM that just died; the load balancer / DNS in front of the VMs skips a dead VM at once.
# Configuration: infra/edge/nginx.conf (shared with compose), adapted to the cluster DNS by deploy.sh.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge
spec:
  selector: { matchLabels: { app: edge } }
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1 } } # one VM at a time
  template:
    metadata:
      labels: { app: edge }
    spec:
      enableServiceLinks: false
      containers:
        - name: edge
          image: nginx:1.29-alpine
          ports:
            - { name: http, containerPort: 80, hostPort: 8080 }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf }
          readinessProbe:
            httpGet: { path: /edge/health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /edge/health, port: 80 }
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: edge-config } # generated by deploy.sh
