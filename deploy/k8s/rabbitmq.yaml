# Broker: three RabbitMQ nodes, one per VM labelled routine/rabbitmq (vm1–vm3). Quorum queues keep a replica
# on every node, so one node can fail. A node's volume (local-path) stays on the VM it first started on –
# the node is pinned to its VM, like before.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodes
spec:
  clusterIP: None
  # a node finishes booting only once it has found its peers by DNS – so the names must resolve before
  # the nodes are ready (otherwise the three wait for each other forever)
  publishNotReadyAddresses: true
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
    - { name: epmd, port: 4369 }
    - { name: dist, port: 25672 }
---
# Management UI on :15672 of every VM – admins only (docs/deployment.md §3). Any node answers for the cluster.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
spec:
  type: NodePort
  selector: { app: rabbitmq }
  ports:
    - { name: management, port: 15672, nodePort: 15672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq-nodes
  replicas: 3
  ordinals: { start: 1 } # pods rabbitmq-1..3 – the node names used everywhere else
  podManagementPolicy: Parallel # start all three at once: they look for each other while forming the cluster
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      enableServiceLinks: false # Kubernetes would add RABBITMQ_* variables the broker reads as its own settings
      nodeSelector: { routine/rabbitmq: "true" }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - { labelSelector: { matchLabels: { app: rabbitmq } }, topologyKey: kubernetes.io/hostname }
      terminationGracePeriodSeconds: 60
      # one user for the broker and the probes' CLI calls: whichever starts first creates the Erlang cookie
      # file, and the other must still be able to read it (as root, a probe would lock the broker out)
      securityContext: { runAsUser: 100, runAsGroup: 101 } # rabbitmq in the image
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management-alpine
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: RABBITMQ_USE_LONGNAME, value: "true" }
            - { name: RABBITMQ_NODENAME, value: "rabbit@$(POD_NAME).rabbitmq-nodes.routine.svc.cluster.local" }
            - name: RABBITMQ_ERLANG_COOKIE # shared secret of the cluster nodes
              valueFrom: { secretKeyRef: { name: routine-secrets, key: RABBITMQ_ERLANG_COOKIE } }
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: config, mountPath: /etc/rabbitmq/conf.d/20-routine.conf, subPath: rabbitmq.conf }
            - { name: config, mountPath: /etc/rabbitmq/conf.d/30-cluster.conf, subPath: rabbitmq-cluster.conf }
            - { name: config, mountPath: /etc/rabbitmq/definitions.json, subPath: definitions.json }
            - { name: config, mountPath: /etc/rabbitmq/advanced.config, subPath: advanced.config }
          startupProbe: # the Erlang node runs – it may still be looking for its peers
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 30
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, check_port_connectivity] }
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            periodSeconds: 30
            timeoutSeconds: 15
      volumes:
        - name: config
          configMap: { name: rabbitmq-config } # generated by deploy.sh from infra/rabbitmq (with the password)
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
