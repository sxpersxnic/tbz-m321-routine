# Kubernetes only – loaded after infra/rabbitmq/rabbitmq.conf and overrides its peer list: a StatefulSet pod
# is reachable by its long name <pod>.<headless service>, so the nodes run with long names.
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1.rabbitmq-nodes.routine.svc.cluster.local
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2.rabbitmq-nodes.routine.svc.cluster.local
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3.rabbitmq-nodes.routine.svc.cluster.local
