# Databases: one PostgreSQL per service – no service can reach another service's data. All five run on the
# VM labelled routine/data (vm4); their volumes (local-path) live on that VM.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
spec:
  selector: { app: keycloak-db }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db
spec:
  serviceName: keycloak-db
  replicas: 1
  selector: { matchLabels: { app: keycloak-db } }
  template:
    metadata:
      labels: { app: keycloak-db }
    spec:
      enableServiceLinks: false
      nodeSelector: { routine/data: "true" }
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: keycloak }
            - { name: POSTGRES_DB, value: keycloak }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: routine-secrets, key: KEYCLOAK_DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: [pg_isready, -U, keycloak, -d, keycloak] }
            periodSeconds: 3
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
