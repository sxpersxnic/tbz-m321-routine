            - { name: WAITING_AFTER_MS, value: "10000" }
            - { name: CHAOS_DUPLICATE_PUBLISH_RATE, value: "0" }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe: # a service listens once its database and the broker answer – give it up to 5 min
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
