# Platform services. The stateless ones run two replicas, never both on the same VM, with zero-downtime
# rolling updates: a new replica must become ready before an old one stops (maxUnavailable: 0).
# Images: routine/<service>:latest here – deploy.sh sets the tag of the build it imported on every VM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: routine-common
data:
  LOG_LEVEL: info
  # Keycloak: keys fetched inside the cluster, `iss` is the public realm URL the browser sees (JWT_ISSUER)
  JWKS_URL: http://keycloak:8080/auth/realms/routine/protocol/openid-connect/certs
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
---
# ------------------------------------------------------------ web client
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web }
    spec:
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - { labelSelector: { matchLabels: { app: web } }, topologyKey: kubernetes.io/hostname }
      containers:
        - name: web
          image: routine/web:latest
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 10
---
# ------------------------------------------------------------ gateway
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  clusterIP: None # the edge gets every replica's address and fails over per request
  selector: { app: gateway }
  ports:
    - { name: http, port: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - { labelSelector: { matchLabels: { app: gateway } }, topologyKey: kubernetes.io/hostname }
      containers:
        - name: gateway
          image: routine/gateway:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: routine-common }
            - configMapRef: { name: routine-settings }
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: routine-secrets, key: RABBITMQ_PASSWORD } }
            - { name: AMQP_URL, value: "amqp://routine:$(RABBITMQ_PASSWORD)@rabbitmq-1.rabbitmq-nodes:5672,amqp://routine:$(RABBITMQ_PASSWORD)@rabbitmq-2.rabbitmq-nodes:5672,amqp://routine:$(RABBITMQ_PASSWORD)@rabbitmq-3.rabbitmq-nodes:5672" }
            - { name: JWT_ISSUER, value: "$(PUBLIC_URL)/auth/realms/routine" }
            - { name: OTEL_SERVICE_NAME, value: gateway }
            - { name: ROUTINE_URL, value: "http://routine-service:3000" }
            - { name: TASK_URL, value: "http://task-service:3000" }
            - { name: NOTIFICATION_URL, value: "http://notification-service:3000" }
            - { name: INTEGRATION_WORKER_URL, value: "http://integration-worker:3000" }
            - { name: WEB_URL, value: "http://web:80" }
            - { name: EXTERNAL_API_URL, value: "http://mock-external:8090" }
            - { name: RABBITMQ_MANAGEMENT_URL, value: "http://rabbitmq-1.rabbitmq-nodes:15672,http://rabbitmq-2.rabbitmq-nodes:15672,http://rabbitmq-3.rabbitmq-nodes:15672" }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe: # a service listens once its database and the broker answer – give it up to 5 min
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
---
