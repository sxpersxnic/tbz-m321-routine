# ------------------------------------------------------------ integration-worker
# Competing consumers: stateless → kubectl -n routine scale deployment integration-worker --replicas=6
apiVersion: v1
kind: Service
metadata:
  name: integration-worker
spec:
  selector: { app: integration-worker }
  ports:
    - { name: http, port: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-worker
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: integration-worker } }
  template:
    metadata:
      labels: { app: integration-worker }
    spec:
      enableServiceLinks: false
      topologySpreadConstraints: # spread over the VMs, but scaling beyond four replicas stays possible
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: integration-worker } } }
      containers:
        - name: integration-worker
          image: routine/integration-worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: routine-common }
            - configMapRef: { name: routine-settings }
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: routine-secrets, key: RABBITMQ_PASSWORD } }
            - { name: AMQP_URL, value: "amqp://routine:$(RABBITMQ_PASSWORD)@rabbitmq-1.rabbitmq-nodes:5672,amqp://routine:$(RABBITMQ_PASSWORD)@rabbitmq-2.rabbitmq-nodes:5672,amqp://routine:$(RABBITMQ_PASSWORD)@rabbitmq-3.rabbitmq-nodes:5672" }
            - { name: JWT_ISSUER, value: "$(PUBLIC_URL)/auth/realms/routine" }
            - { name: OTEL_SERVICE_NAME, value: integration-worker }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: routine-secrets, key: INTEGRATION_DB_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://integration:$(DB_PASSWORD)@integration-db:5432/integration" }
            - { name: EXTERNAL_API_URL, value: "http://mock-external:8090" }
            - { name: HTTP_ALLOWED_HOSTS, value: mock-external }
            - { name: PREFETCH, value: "1" }
            - { name: CHAOS_FAILURE_RATE, value: "0" }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe: # a service listens once its database and the broker answer – give it up to 5 min
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
---
# ------------------------------------------------------------ mock-external
# simulated third-party APIs (not part of the platform) – reached only inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: mock-external
spec:
  selector: { app: mock-external }
  ports:
    - { name: http, port: 8090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-external
spec:
  replicas: 1
  selector: { matchLabels: { app: mock-external } }
  template:
    metadata:
      labels: { app: mock-external }
    spec:
      enableServiceLinks: false
      # one replica: on a VM failure, start it elsewhere after 30 s instead of Kubernetes' default 5 minutes
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: mock-external
          image: routine/mock-external:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: routine-common }
          env:
            - { name: OTEL_SERVICE_NAME, value: mock-external }
            - { name: PORT, value: "8090" }
          ports:
            - { name: http, containerPort: 8090 }
          startupProbe:
            httpGet: { path: /health, port: 8090 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8090 }
            periodSeconds: 5
