# Routine – complete system. Start everything with:
#   docker compose up -d --build --wait
#
# UI / API:        http://localhost:8080   (edge → gateway replicas → web + services)
# Keycloak admin:  http://localhost:8080/auth/admin   (admin / admin – development only)
# RabbitMQ:        http://localhost:15672   (routine / routine; nodes 2 and 3 on :15673 / :15674)
# Jaeger tracing:  http://localhost:16686
# Mock external:   http://localhost:8090
#
# Profiles (v2 services, docs/v2/03-architecture.md §7) – without a profile: v1 core + trigger, today, connector
#   --profile domains    budget, health, people, home, calendar
#   --profile presence   delivery-service
#   --profile ai         assistant-service
#   --profile all        everything

name: routine

x-node-service: &node-service
  init: true
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

x-build: &build
  context: .
  dockerfile: docker/node-service.Dockerfile

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # every broker node – a client moves on to the next node when its node fails
  AMQP_URL: amqp://routine:routine@rabbitmq-1:5672,amqp://routine:routine@rabbitmq-2:5672,amqp://routine:routine@rabbitmq-3:5672
  # Keycloak: keys fetched inside the network, `iss` is the public realm URL the browser sees
  JWKS_URL: http://keycloak:8080/auth/realms/routine/protocol/openid-connect/certs
  JWT_ISSUER: ${PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}}/auth/realms/routine
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

# Platform services run as two replicas each: losing one container never takes a capability down.
# All background work is replica-safe (SKIP LOCKED, unique slots, advisory locks) – see docs/availability.md.
x-replicated: &replicated
  replicas: ${SERVICE_REPLICAS:-2}

x-broker-ready: &broker-ready
  rabbitmq-1: { condition: service_healthy }
  rabbitmq-2: { condition: service_healthy }
  rabbitmq-3: { condition: service_healthy }

x-rabbitmq: &rabbitmq
  image: rabbitmq:4.1-management-alpine
  restart: unless-stopped
  environment:
    RABBITMQ_ERLANG_COOKIE: routine-cluster-cookie # shared secret of the cluster nodes
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 10s

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 30

services:
  # ------------------------------------------------------------ infrastructure
  # three-node cluster: quorum queues keep a replica on every node, so one node can fail
  # (stable hostnames → stable node names → durable queues survive container re-creation)
  rabbitmq-1:
    <<: *rabbitmq
    hostname: rabbitmq-1
    ports:
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-routine.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/advanced.config:/etc/rabbitmq/advanced.config:ro
      - rabbitmq-1-data:/var/lib/rabbitmq
  rabbitmq-2:
    <<: *rabbitmq
    hostname: rabbitmq-2
    ports:
      - "15673:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-routine.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/advanced.config:/etc/rabbitmq/advanced.config:ro
      - rabbitmq-2-data:/var/lib/rabbitmq
  rabbitmq-3:
    <<: *rabbitmq
    hostname: rabbitmq-3
    ports:
      - "15674:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-routine.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/advanced.config:/etc/rabbitmq/advanced.config:ro
      - rabbitmq-3-data:/var/lib/rabbitmq

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    restart: unless-stopped
    ports:
      - "16686:16686"

  # one database per service – no service can reach another service's data
  keycloak-db:
    <<: *postgres
    environment: { POSTGRES_USER: keycloak, POSTGRES_PASSWORD: keycloak, POSTGRES_DB: keycloak }
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
  routine-db:
    <<: *postgres
    environment: { POSTGRES_USER: routine, POSTGRES_PASSWORD: routine, POSTGRES_DB: routine }
    volumes: [routine-db-data:/var/lib/postgresql/data]
  task-db:
    <<: *postgres
    environment: { POSTGRES_USER: task, POSTGRES_PASSWORD: task, POSTGRES_DB: task }
    volumes: [task-db-data:/var/lib/postgresql/data]
  notification-db:
    <<: *postgres
    environment: { POSTGRES_USER: notification, POSTGRES_PASSWORD: notification, POSTGRES_DB: notification }
    volumes: [notification-db-data:/var/lib/postgresql/data]
  integration-db:
    <<: *postgres
    environment: { POSTGRES_USER: integration, POSTGRES_PASSWORD: integration, POSTGRES_DB: integration }
    volumes: [integration-db-data:/var/lib/postgresql/data]
  # v2 services: one database + role each, co-hosted on one instance to keep laptop memory reasonable
  # (ADR-12) – a role can connect to its own database only. The Swarm stack gives each its own instance.
  domains-db:
    <<: *postgres
    environment: { POSTGRES_USER: domains, POSTGRES_PASSWORD: domains, POSTGRES_DB: domains }
    volumes:
      - domains-db-data:/var/lib/postgresql/data
      - ./infra/postgres/domains-init.sql:/docker-entrypoint-initdb.d/10-domains.sql:ro

  # ------------------------------------------------------------ services
  # edge load balancer: the only container on the public port, spreads requests over the gateway replicas
  edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/edge/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      gateway: { condition: service_healthy }

  # web client (React/Vite, served by nginx) – reached through the gateway
  web:
    build: ./web
    image: routine/web:latest
    restart: unless-stopped
    deploy: *replicated
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *node-service
    build: { <<: *build, args: { SERVICE: gateway } }
    image: routine/gateway:latest
    deploy: *replicated
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: gateway
      ROUTINE_URL: http://routine-service:3000
      TASK_URL: http://task-service:3000
      NOTIFICATION_URL: http://notification-service:3000
      INTEGRATION_WORKER_URL: http://integration-worker:3000
      WEB_URL: http://web:80
      EXTERNAL_API_URL: http://mock-external:8090
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq-1:15672,http://rabbitmq-2:15672,http://rabbitmq-3:15672

  # identity provider: users, sign-in, registration, tokens (realm "routine" as code: infra/keycloak/).
  # Two replicas form one cluster – they find each other through their database (jdbc-ping) and share
  # sessions, so a sign-in survives the loss of either replica.
  keycloak:
    build: { context: ., dockerfile: docker/keycloak.Dockerfile }
    image: routine/keycloak:latest
    restart: unless-stopped
    deploy: *replicated
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # every URL Keycloak hands out (issuer, token endpoint …) is this public one – services still fetch
      # the keys from http://keycloak:8080 directly (JWKS_URL), which works whatever the hostname
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}}/auth
      KC_HTTP_ENABLED: "true" # no TLS in this setup (docs/architecture.md §11)
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # development only – the VM deployment generates it
      ROUTINE_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}} # allowed redirect after sign-in
      # service accounts (confidential clients in the realm) – the same secret goes to the service itself
      INTEGRATION_WORKER_TOKEN_SECRET: ${INTEGRATION_WORKER_TOKEN_SECRET:-dev-integration-worker-secret}
    healthcheck:
      # the image has no curl/wget – plain bash against the management port. Check the status line, not
      # the body: a not-ready body still holds "UP" (the "Graceful Shutdown" sub-check) next to a 503.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '^HTTP/1.1 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      keycloak-db: { condition: service_healthy }

  routine-service:
    <<: *node-service
    build: { <<: *build, args: { SERVICE: routine-service } }
    image: routine/routine-service:latest
    deploy: *replicated
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: routine-service
      DATABASE_URL: postgres://routine:routine@routine-db:5432/routine
      # Schema evolution phase of ExecutionCompleted: v1 | expand | v2
      EXECUTION_COMPLETED_FORMAT: ${EXECUTION_COMPLETED_FORMAT:-v2}
      WAITING_AFTER_MS: ${WAITING_AFTER_MS:-10000}
      CHAOS_DUPLICATE_PUBLISH_RATE: ${CHAOS_DUPLICATE_PUBLISH_RATE:-0}
    depends_on:
      routine-db: { condition: service_healthy }
      <<: *broker-ready

  task-service:
    <<: *node-service
    build: { <<: *build, args: { SERVICE: task-service } }
    image: routine/task-service:latest
    deploy: *replicated
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: task-service
      DATABASE_URL: postgres://task:task@task-db:5432/task
      CHAOS_FAILURE_RATE: ${TASK_CHAOS_FAILURE_RATE:-0}
    depends_on:
      task-db: { condition: service_healthy }
      <<: *broker-ready

  notification-service:
    <<: *node-service
    build: { <<: *build, args: { SERVICE: notification-service } }
    image: routine/notification-service:latest
    deploy: *replicated
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: notification-service
      DATABASE_URL: postgres://notification:notification@notification-db:5432/notification
      # Consumer version for ExecutionCompleted: legacy (v1 only) | tolerant (v1 + v2)
      COMPLETION_EVENT_READER: ${COMPLETION_EVENT_READER:-tolerant}
      CHAOS_FAILURE_RATE: ${NOTIFICATION_CHAOS_FAILURE_RATE:-0}
    depends_on:
      notification-db: { condition: service_healthy }
      <<: *broker-ready

  integration-worker:
    <<: *node-service
    build: { <<: *build, args: { SERVICE: integration-worker } }
    image: routine/integration-worker:latest
    deploy:
      replicas: ${INTEGRATION_WORKER_REPLICAS:-2} # stateless → scale with `docker compose up -d --scale integration-worker=5`
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: integration-worker
      DATABASE_URL: postgres://integration:integration@integration-db:5432/integration
      SERVICE_TOKEN_SECRET: ${INTEGRATION_WORKER_TOKEN_SECRET:-dev-integration-worker-secret} # its service account (client-credentials)
      EXTERNAL_API_URL: http://mock-external:8090
      HTTP_ALLOWED_HOSTS: mock-external
      PREFETCH: ${INTEGRATION_WORKER_PREFETCH:-1}
      CHAOS_FAILURE_RATE: ${INTEGRATION_CHAOS_FAILURE_RATE:-0}
    depends_on:
      integration-db: { condition: service_healthy }
      <<: *broker-ready

  # simulated third-party APIs (not part of the platform)
  mock-external:
    <<: *node-service
    build: { <<: *build, args: { SERVICE: mock-external } }
    image: routine/mock-external:latest
    ports:
      - "8090:8090"
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: mock-external
      PORT: 8090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
  rabbitmq-3-data:
  keycloak-db-data:
  routine-db-data:
  task-db-data:
  notification-db-data:
  integration-db-data:
  domains-db-data:
