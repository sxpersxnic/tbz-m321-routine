# Edge load balancer: owns the public port and spreads requests over all gateway replicas.
# Deliberately config-only (no auth, no routing logic, no dependencies) – everything that can
# fail for application reasons lives in the replicated gateway. See docs/availability.md.

# Docker's embedded DNS: re-resolve every 2 s, so scaled / restarted replicas are picked up
resolver 127.0.0.11 valid=2s ipv6=off;

upstream gateway {
  zone gateway 64k;
  server gateway:3000 resolve max_fails=1 fail_timeout=5s;
  keepalive 32;
}

# identity provider: sign-in pages, tokens, keys, admin console – the browser keeps one origin
upstream keycloak {
  zone keycloak 64k;
  server keycloak:8080 resolve max_fails=1 fail_timeout=5s;
  keepalive 16;
}

server {
  listen 80;
  server_tokens off;

  location = /edge/health {
    default_type application/json;
    return 200 '{"status":"ok","service":"edge","instance":"$hostname"}';
  }

  location /auth/ {
    proxy_pass http://keycloak;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host; # with the port – $host drops it
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keycloak's cookies and headers exceed nginx's default buffers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    # Unlike the API, Keycloak's POSTs may go to the other replica even after they were sent: a code is
    # single-use, a refresh can be repeated, a second registration hits the unique e-mail. Without this, the
    # first request after a replica dies fails on its pooled connection.
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
    error_page 502 504 = @unavailable;
  }

  location / {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A replica that is gone → try the next one. nginx never repeats a POST/PATCH/DELETE
    # that already reached a gateway (no `non_idempotent`), so failover cannot double a write.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;
    error_page 502 504 = @unavailable;
  }

  # No replica answered (nginx's own 502/504 only – an upstream's own 5xx passes through unchanged):
  # "try again shortly" instead of "broken", like the gateway does for its services.
  location @unavailable {
    add_header Retry-After 10 always;
    default_type application/problem+json;
    return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"code":"upstream_unavailable","detail":"The service is temporarily unavailable, try again shortly"}';
  }
}
