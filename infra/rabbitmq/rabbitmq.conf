# Broker topology (exchanges, queues, bindings) is declared as code and loaded
# on every start – so work queues exist even before their consumers start.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

loopback_users = none

# Three-node cluster – no single broker node is required (see docs/availability.md).
# The nodes find each other through this static list and form one cluster on first start.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3
# on separate VMs the nodes start minutes apart (image pulls) – keep looking for the peers for up to 5 min
cluster_formation.discovery_retry_limit = 150
cluster_formation.discovery_retry_interval = 2000

# Quorum queues replicate via Raft: 3 replicas tolerate the loss of one node. A queue declared
# while the cluster was still forming starts with fewer members – reconciliation adds the missing
# replicas as soon as nodes join (and after a node is replaced).
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.trigger_interval = 5000

# On a network split, the minority side pauses instead of accepting writes it cannot replicate.
cluster_partition_handling = pause_minority

# refresh queue statistics every second (management UI / system status in the demo);
# the quorum queue metrics tick is set in advanced.config (not exposed in rabbitmq.conf)
collect_statistics_interval = 1000
