# Broker topology (exchanges, queues, bindings) is declared as code and loaded
# on every start – so work queues exist even before their consumers start.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

loopback_users = none

# refresh queue statistics every second (management UI / system status in the demo);
# the quorum queue metrics tick is set in advanced.config (not exposed in rabbitmq.conf)
collect_statistics_interval = 1000
