<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Routine</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before first paint: without it a pinned theme flashes the
      // opposite colours until the bundle has loaded and React has mounted.
      var theme = null;
      try { theme = localStorage.getItem('routine.theme'); } catch {}
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
